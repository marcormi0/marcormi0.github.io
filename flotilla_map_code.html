<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Global Sumud Flotilla - Live Progress Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="styles/map.css">
</head>
<body>
  <!-- Back Navigation Button -->
  <a href="index.html" id="backBtn" class="back-nav-button">
    <span class="nav-icon">←</span>
    <span class="nav-text">Back to Main</span>
  </a>

  <div class="header">
    <h1>🚢 Global Sumud Flotilla</h1>
    <p>Real-time tracking of humanitarian ships to Gaza</p>
  </div>

  <div class="control-panel">
    <h3 style="font-size: 14px; font-weight: 700; color: #1f2937; margin-bottom: 12px;">
      📊 Fleet Status
    </h3>
    <div class="status-grid" id="shipStatusGrid">
      <!-- Ship statuses will be populated here -->
    </div>
    
    <div class="legend">
      <h4>Legend</h4>
      <div class="legend-item">
        <div class="status-dot status-sailing"></div>
        <span>Currently Sailing</span>
      </div>
      <div class="legend-item">
        <div class="status-dot status-preparing"></div>
        <span>Preparing to Depart</span>
      </div>
      <div class="legend-item">
        <div class="status-dot status-detained"></div>
        <span>Detained/Blocked</span>
      </div>
      <div class="legend-item">
        <div class="status-dot status-arrived"></div>
        <span>Mission Complete</span>
      </div>
    </div>
  </div>

  <div class="map-container">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="scripts/map.js"></script>
</body>
</html>
